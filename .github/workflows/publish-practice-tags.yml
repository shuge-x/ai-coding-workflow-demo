name: Verify published practice story start tags

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - story-tags.json
      - .github/workflows/publish-practice-tags.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Verify every story tag points to its declared commit
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const tags = require("./story-tags.json");
          for (const [tag, entry] of Object.entries(tags)) {
            const actual = execFileSync("git", ["rev-list", "-n", "1", `refs/tags/${tag}^{commit}`], { encoding: "utf8" }).trim();
            if (actual !== entry.sha) {
              throw new Error(`Tag ${tag} points to ${actual}, expected ${entry.sha}`);
            }
            console.log(`Verified ${tag} -> ${actual}`);
          }
          NODE
